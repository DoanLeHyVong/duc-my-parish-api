name: API production deploy

on:
  workflow_run:
    workflows: [API CI]
    types: [completed]
    branches: [main]

concurrency:
  group: api-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run build
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/duc-my-parish-api:production-${{ github.event.workflow_run.head_sha }}
      - uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd "${{ vars.PRODUCTION_DEPLOY_PATH }}"
            export API_IMAGE="ghcr.io/${{ github.repository_owner }}/duc-my-parish-api:production-${{ github.event.workflow_run.head_sha }}"
            ./scripts/deploy.sh .env.production
            API_URL=https://api.giaoxuducmy.org WEB_URL=https://giaoxuducmy.org ./scripts/smoke.sh
