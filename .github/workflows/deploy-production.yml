name: API production deploy

on:
  workflow_run:
    workflows: [API CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: api-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      vars.PRODUCTION_READINESS_CONFIRMED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify this is still the latest main commit
        shell: bash
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.event.workflow_run.head_sha }}"
      - name: Normalize GHCR image owner
        shell: bash
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/duc-my-parish-api" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
        env:
          DATABASE_URL: mysql://ci:ci-password@127.0.0.1:3306/appglv_unified_test
      - run: npm run lint
      - run: npm run build
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REPO }}:production-${{ github.event.workflow_run.head_sha }}
      - name: Recheck main before deployment
        shell: bash
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.event.workflow_run.head_sha }}"
      - name: Require pinned VPS host key
        shell: bash
        env:
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: test -n "$VPS_HOST_FINGERPRINT"
      - uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          source: deploy
          target: ${{ vars.PRODUCTION_DEPLOY_PATH }}/releases/${{ github.event.workflow_run.head_sha }}
      - uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          script: |
            set -eu
            cd "${{ vars.PRODUCTION_DEPLOY_PATH }}"
            export COMPOSE_FILE="$PWD/docker-compose.yml"
            export DEPLOY_CONFIG_SOURCE="$PWD/releases/${{ github.event.workflow_run.head_sha }}/deploy"
            export API_IMAGE="${{ env.IMAGE_REPO }}:production-${{ github.event.workflow_run.head_sha }}"
            "$DEPLOY_CONFIG_SOURCE/scripts/deploy.sh" .env.production
