name: API staging deploy

on:
  workflow_run:
    workflows: [API CI]
    types: [completed]
    branches: [staging]

concurrency:
  group: api-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run build
      - run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.CI_JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.CI_JWT_REFRESH_SECRET }}
          CLIENT_URL: http://localhost:5173
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/duc-my-parish-api:staging-${{ github.event.workflow_run.head_sha }}
      - uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd "${{ vars.STAGING_DEPLOY_PATH }}"
            export API_IMAGE="ghcr.io/${{ github.repository_owner }}/duc-my-parish-api:staging-${{ github.event.workflow_run.head_sha }}"
            ./scripts/deploy.sh .env.staging
            API_URL=https://api.hyvongofficial.online WEB_URL=https://giaoxu.hyvongofficial.online ./scripts/smoke.sh
