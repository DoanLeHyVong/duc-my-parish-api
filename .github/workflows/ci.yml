name: API CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: appglv_unified_test
          MARIADB_USER: ci
          MARIADB_PASSWORD: ci-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
        env:
          DATABASE_URL: mysql://ci:ci-password@127.0.0.1:3306/appglv_unified_test
      - name: Apply disposable test migration
        run: npm run prisma:migrate:deploy
        env:
          DATABASE_URL: mysql://ci:ci-password@127.0.0.1:3306/appglv_unified_test
      - run: npm run lint
      - run: npm run build
      - run: node --test deploy/manual/tests/check.mjs
      - run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: mysql://ci:ci-password@127.0.0.1:3306/appglv_unified_test
          JWT_ACCESS_SECRET: ci-access-secret-please-use-only-in-ci
          JWT_REFRESH_SECRET: ci-refresh-secret-please-use-only-in-ci
          CLIENT_URL: http://localhost:5173
      - run: npm audit --omit=dev --audit-level=high
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package manual Linux release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tar -czf "ducmy-api-${GITHUB_SHA}.tar.gz" dist prisma prisma.config.ts package.json package-lock.json node_modules
          sha256sum "ducmy-api-${GITHUB_SHA}.tar.gz" > "ducmy-api-${GITHUB_SHA}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: ducmy-api-${{ github.sha }}
          path: |
            ducmy-api-${{ github.sha }}.tar.gz
            ducmy-api-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
